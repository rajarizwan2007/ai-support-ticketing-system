openapi: 3.0.3
info:
  title: 'ai-support-ticketing-system API Documentation'
  description: 'Create, list, show and reply to support tickets in your organization.'
  version: 1.0.0
servers:
  -
    url: 'http://acme.localhost:8088'
tags:
