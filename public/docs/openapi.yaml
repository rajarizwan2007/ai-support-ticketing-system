      scheme: bearer
      description: 'Get a token from <code>POST /api/v1/tokens</code> with your email and password.'
security:
  -
    default: []
paths:
  /api/v1/tokens:
    post:
      summary: 'Create a token'
      operationId: createAToken
      description: 'Log in with email and password and get a token for the Authorization header.'
      parameters: []
      responses:
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  token: 1|aBcDeFgHiJkLmNoPqRsTuVwXyZ
                properties:
                  token:
                    type: string
                    example: 1|aBcDeFgHiJkLmNoPqRsTuVwXyZ
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Must be a valid email address.'
                  example: gbailey@example.net
                password:
                  type: string
                  description: ''
                  example: '|]|{+-'
                device_name:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: v
              required:
                - email
                - password
                - device_name
      security: []
  /api/v1/tokens/current:
    delete:
      summary: 'Revoke the current token'
      operationId: revokeTheCurrentToken
      description: ''
      parameters: []
      responses:
        204:
          description: ''
          content:
            application/json:
              schema:
                type: object
                nullable: true
      tags:
        - Authentication
