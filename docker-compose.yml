name: ai-support-ticketing

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: ticketing-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/zz-app.ini:ro
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-ticketing}
      DB_USERNAME: ${DB_USERNAME:-ticketing}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-null}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ticketing

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: ticketing-queue
    restart: unless-stopped
    working_dir: /var/www/html
    # Horizon runs the queue workers (dashboard at /horizon). Workers keep the code in memory:
    # after changing PHP code, run `docker compose exec queue php artisan horizon:terminate` (the container restarts it).
    command: ["php", "artisan", "horizon"]
    volumes:
      - ./:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/zz-app.ini:ro
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-ticketing}
      DB_USERNAME: ${DB_USERNAME:-ticketing}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-null}
    depends_on:
      - app
    networks:
      - ticketing

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: ticketing-scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    # Runs due scheduled tasks every minute (see routes/console.php), e.g. the SLA breach check.
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - ./:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/zz-app.ini:ro
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-ticketing}
      DB_USERNAME: ${DB_USERNAME:-ticketing}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-null}
    depends_on:
      - app
    networks:
      - ticketing

  mailpit:
    image: axllent/mailpit:v1.27
    container_name: ticketing-mailpit
    restart: unless-stopped
    ports:
      - "${FORWARD_MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - ticketing

  ollama:
    image: ollama/ollama:0.35.0
    container_name: ticketing-ollama
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - ticketing

  # Python FastAPI service in front of Ollama (ai-service/). Reachable from the
  # other containers at http://ai:8000; API docs at http://localhost:8001/docs.
  ai:
    build: ./ai-service
    container_name: ticketing-ai
    restart: unless-stopped
    # Host user, so caches written into the bind mount stay yours.
    user: "${UID:-1000}:${GID:-1000}"
    # --reload: code changes in ai-service/app apply without a restart.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./ai-service:/app
    environment:
      OLLAMA_URL: http://ollama:11434
      EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-qwen3-embedding:0.6b}
      CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-gemma3:1b}
    ports:
      - "127.0.0.1:${FORWARD_AI_PORT:-8001}:8000"
    depends_on:
      - ollama
    networks:
      - ticketing

  nginx:
    image: nginx:1.27-alpine
    container_name: ticketing-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8088}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - ticketing

  postgres:
    image: pgvector/pgvector:pg17
    container_name: ticketing-postgres
    restart: unless-stopped
    ports:
      - "${FORWARD_DB_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-ticketing}
      POSTGRES_USER: ${DB_USERNAME:-ticketing}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ticketing

  redis:
    image: redis:7-alpine
    container_name: ticketing-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${FORWARD_REDIS_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - ticketing

networks:
  ticketing:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  ollama-data:
